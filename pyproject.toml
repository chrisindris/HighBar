[tool.poetry]
name = "highbar"
version = "0.1.0"
description = "HighBar: An LLM Benchmark for Ontario Law"
authors = ["Christopher Indris <chris@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "highbar"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.0.0"
transformers = "^4.35.0"
datasets = "^2.14.0"
accelerate = "^0.24.0"
peft = "^0.6.0"
bitsandbytes = "^0.41.0"
typer = {extras = ["all"], version = "^0.9.0"}
pydantic = "^2.5.0"
pandas = "^2.1.0"
pyarrow = "^14.0.0"
huggingface-hub = "^0.19.0"
tqdm = "^4.66.0"
jinja2 = "^3.1.0"
pyyaml = "^6.0"
requests = "^2.31.0"
click = "^8.1.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
nltk = "^3.8.0"
rouge-score = "^0.1.2"
bert-score = "^0.3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
ipython = "^8.17.0"
jupyter = "^1.0.0"

[tool.poetry.scripts]
highbar = "highbar.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=highbar --cov-report=term-missing --cov-report=html"
